<svg width="80" height="60" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
  <!-- 主体矩形 -->
  <rect x="10" y="10" width="60" height="40" rx="3" ry="3" fill="transparent" stroke="#f59e0b" stroke-width="2"/>
  <rect x="14" y="14" width="52" height="32" rx="2" ry="2" fill="transparent" stroke="#f59e0b" stroke-width="1"/>
  
  <!-- 量子密钥特征图案 -->
  <g stroke="#f59e0b" stroke-width="1.5" fill="transparent">
    <!-- 中心量子符号 -->
    <circle cx="40" cy="30" r="8"/>
    <path d="M40 22 L40 38 M22 30 L58 30"/>
    <!-- 环绕的密钥波形 -->
    <path d="M20 20 Q25 15, 30 20 T40 20 T50 20 T60 20" stroke-linecap="round"/>
    <path d="M20 40 Q25 45, 30 40 T40 40 T50 40 T60 40" stroke-linecap="round"/>
  </g>
  
  <!-- 接口标识 -->
  <circle cx="10" cy="25" r="2" fill="#f59e0b"/>
  <circle cx="10" cy="35" r="2" fill="#f59e0b"/>
  <circle cx="70" cy="25" r="2" fill="#f59e0b"/>
  <circle cx="70" cy="35" r="2" fill="#f59e0b"/>
  
  <!-- 文字标注 -->
  <text x="40" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">量子密钥终端</text>
</svg>
